# Droplet OS — build configuration (sourced by base/build.sh)
# Every value can be overridden from the environment: SUITE=... ./base/build.sh

DROPLET_VERSION="${DROPLET_VERSION:-0.2.0}"
DROPLET_CODENAME="${DROPLET_CODENAME:-aura}"

# Ubuntu 26.04 LTS "Resolute Raccoon" (released 2026-04-23, standard support to 2031-04)
SUITE="${SUITE:-resolute}"
MIRROR="${MIRROR:-http://archive.ubuntu.com/ubuntu}"
COMPONENTS="${COMPONENTS:-main universe}"
ARCH="${ARCH:-amd64}"

# vm       : linux-virtual, no firmware/microcode -> small, fast, for QEMU/VirtualBox tests
# hardware : linux-generic + linux-firmware + microcode -> for real x86-64 machines
PROFILE="${PROFILE:-vm}"

# Live session
LIVE_USER="${LIVE_USER:-droplet}"
LIVE_HOSTNAME="${LIVE_HOSTNAME:-droplet}"
DEFAULT_LOCALE="${DEFAULT_LOCALE:-fr_FR.UTF-8}"
DEFAULT_TIMEZONE="${DEFAULT_TIMEZONE:-Africa/Douala}"
DEFAULT_KEYMAP="${DEFAULT_KEYMAP:-fr}"

# squashfs compression: zstd (fast build) or xz (smaller ISO)
SQUASHFS_COMP="${SQUASHFS_COMP:-zstd}"
ISO_VOLID="${ISO_VOLID:-DROPLET_0_2}"

# Layers on top of the base. 0.2: "desktop" = Droplet session (KWin + Droplet shell).
# LAYERS="" builds the 0.1 console base only.
LAYERS="${LAYERS-desktop}"
