# Droplet OS @VERSION@ — live ISO boot menu (BIOS + UEFI)
# The menu is hidden (seamless boot). Press Esc or Shift during the countdown to show it.
set default=0
set timeout=2
set timeout_style=hidden
set color_normal=light-gray/black
set menu_color_normal=light-gray/black
set menu_color_highlight=white/blue

if loadfont unicode ; then
  set gfxmode=auto
  set gfxpayload=keep
  insmod all_video
  insmod gfxterm
  terminal_output gfxterm
fi

# Seamless graphical boot: no kernel text, no blinking cursor, splash on.
set droplet_quiet="quiet splash loglevel=3 rd.udev.log_level=3 systemd.show_status=false vt.global_cursor_default=0"

menuentry "Droplet OS @VERSION@" {
  linux  /casper/vmlinuz boot=casper $droplet_quiet ---
  initrd /casper/initrd
}
menuentry "Droplet OS @VERSION@ — Graphismes sans échec (nomodeset)" {
  linux  /casper/vmlinuz boot=casper nomodeset $droplet_quiet ---
  initrd /casper/initrd
}
menuentry "Droplet OS @VERSION@ — Diagnostic (texte, console série)" {
  linux  /casper/vmlinuz boot=casper nosplash plymouth.enable=0 console=tty0 console=ttyS0,115200n8 ---
  initrd /casper/initrd
}
menuentry "Droplet OS @VERSION@ — Récupération (rescue.target)" {
  linux  /casper/vmlinuz boot=casper nosplash systemd.unit=rescue.target ---
  initrd /casper/initrd
}
if [ "$grub_platform" = "efi" ]; then
  menuentry "Paramètres du micrologiciel UEFI" { fwsetup }
fi
